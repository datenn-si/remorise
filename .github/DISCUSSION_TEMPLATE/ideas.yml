title: "[提案] "
body:
  - type: markdown
    attributes:
      value: |
        新機能の提案ありがとうございます。
        バグの報告は Issue へお願いします。
  - type: textarea
    id: summary
    attributes:
      label: 提案の概要
      description: どんな機能がほしいか、1〜2文で書いてください。
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景と課題
      description: 今の何に困っていて、それがどうなれば解決するか書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案の内容
      description: 具体的な動きや画面のイメージがあれば書いてください。
    validations:
      required: true
