<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remorise</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#131015" />
    <script>
      try {
        var scheme = localStorage.getItem('remorise.scheme') || 'device';
        var hue = Number(localStorage.getItem('remorise.hue') || '314');
        if (scheme !== 'device' && scheme !== 'light' && scheme !== 'dark') scheme = 'device';
        if (!isFinite(hue)) hue = 314;
        hue = Math.min(360, Math.max(0, hue));
        document.documentElement.dataset.scheme = scheme;
        document.documentElement.style.setProperty('--hue', String(hue));
        var light =
          scheme === 'light' ||
          (scheme === 'device' && window.matchMedia('(prefers-color-scheme: light)').matches);
        var base = light ? [0.97, 0.01] : [0.178, 0.012];
        var rad = (hue * Math.PI) / 180;
        var oa = base[1] * Math.cos(rad);
        var ob = base[1] * Math.sin(rad);
        var ol = base[0] + 0.3963377774 * oa + 0.2158037573 * ob;
        var om = base[0] - 0.1055613458 * oa - 0.0638541728 * ob;
        var os = base[0] - 0.0894841775 * oa - 1.291485548 * ob;
        var cl = ol * ol * ol;
        var cm = om * om * om;
        var cs = os * os * os;
        var channels = [
          4.0767416621 * cl - 3.3077115913 * cm + 0.2309699292 * cs,
          -1.2684380046 * cl + 2.6097574011 * cm - 0.3413193965 * cs,
          -0.0041960863 * cl - 0.7034186147 * cm + 1.707614701 * cs,
        ];
        var hex = channels
          .map(function (channel) {
            var clamped = Math.min(1, Math.max(0, channel));
            var srgb =
              clamped <= 0.0031308 ? 12.92 * clamped : 1.055 * Math.pow(clamped, 1 / 2.4) - 0.055;
            return Math.round(srgb * 255)
              .toString(16)
              .padStart(2, '0');
          })
          .join('');
        document.querySelector('meta[name="theme-color"]').content = '#' + hex;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
